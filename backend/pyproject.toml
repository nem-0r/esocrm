[project]
name = "astra-crm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "redis>=5.2",
  "bcrypt>=4.2",
  "cryptography>=43",
  "python-multipart>=0.0.17",
  "telethon>=1.37",
  # Прокси для MTProto: у каждого номера свой выход в сеть (решение D-21).
  "python-socks[asyncio]>=2.5",
  "apscheduler>=3.10",
  "boto3>=1.35",
  "openpyxl>=3.1",
  "python-dateutil>=2.9",
  "orjson>=3.10",
  # Картинка QR для входа в Telegram. Рисуем на сервере, чтобы её нельзя было
  # испортить темой оформления или размером экрана; PIL не нужен — только SVG.
  "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
  "faker>=30",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Запросы статистики собираются склейкой строк, но подставляются только
# внутренние константы (_seller_clause/_account_clause) и гранулярность,
# проверенная по белому списку. Всё пользовательское идёт параметрами.
"app/services/stats_service.py" = ["S608"]
"app/services/search_service.py" = ["S608"]
# Тот же паттерн: склейка с фиксированной внутренней строкой (`clause`),
# без подстановки пользовательского ввода — он идёт параметром `:uid`.
"tests/verify_analytics.py" = ["S608"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = []
ignore_missing_imports = true
