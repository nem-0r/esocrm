# Продакшен-контур Астра CRM.
#
# Запуск:  docker compose -f docker-compose.prod.yml up -d --build
# Логи:    docker compose -f docker-compose.prod.yml logs -f api gateway scheduler
#
# Отличия от docker-compose.yml (контур разработки):
#   * образы собираются со стадии `prod` — исходники внутри образа, без --reload
#     и без монтирования каталогов с машины;
#   * наружу открыты только 80 и 443 (nginx). База, Redis и MinIO доступны
#     только внутри сети контейнеров;
#   * миграции выполняет отдельный одноразовый сервис `migrate`, api стартует
#     только после его успешного завершения;
#   * у всех сервисов restart: unless-stopped и ограничения памяти/CPU
#     под VPS с 8 ГБ ОЗУ.
#
# Имя проекта отличается от контура разработки намеренно: тома не пересекаются,
# случайный `down -v` в одном контуре не сносит данные другого.
#
# Образы: CI собирает их один раз, проверяет и кладёт в реестр под номером
# коммита, а выкатка (deploy/deploy.sh) скачивает ровно их — на сервер едет
# то, что прошло проверки. IMAGE_TAG/BACKEND_IMAGE/WEB_IMAGE выкатка сама
# записывает в .env. Без них (первый запуск, ручная сборка) образы собираются
# здесь же из исходников, как раньше: `up -d --build`.
name: astra-crm-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile
  target: prod

x-backend-image: &backend-image ${BACKEND_IMAGE:-astra-backend}:${IMAGE_TAG:-local}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Настройки считаются по размеру сервера (deploy/resource_plan.py пишет значения
    # в .env, docs/17-resource-autoscaling.md §5.3); значения по умолчанию — прежние.
    # random_page_cost=1.1 и effective_io_concurrency=200 — для SSD; jit=off — для
    # нагрузки «много коротких запросов», где компиляция только мешает.
    command: >
      postgres -c shared_buffers=${ASTRA_DB_SHARED_BUFFERS:-512MB}
               -c work_mem=${ASTRA_DB_WORK_MEM:-16MB}
               -c maintenance_work_mem=${ASTRA_DB_MAINTENANCE_WORK_MEM:-64MB}
               -c max_connections=${ASTRA_DB_MAX_CONNECTIONS:-100}
               -c effective_cache_size=${ASTRA_DB_EFFECTIVE_CACHE_SIZE:-1536MB}
               -c max_wal_size=${ASTRA_DB_MAX_WAL_SIZE:-1GB}
               -c random_page_cost=1.1 -c effective_io_concurrency=200 -c jit=off
    # /dev/shm у контейнера по умолчанию 64 МБ — параллельным запросам по мере роста
    # базы этого не хватает.
    shm_size: ${ASTRA_DB_SHM:-64m}
    # Приоритеты (docs/17 §5.4): при нехватке процессора выигрывает база, при нехватке
    # памяти ядро убивает кого угодно, но не её.
    cpu_shares: ${ASTRA_DB_CPU_SHARES:-2048}
    oom_score_adj: -500
    # Порт наружу не публикуется: до базы дотягиваются только контейнеры.
    # Доступ администратора — через `docker compose exec db psql` или ssh-туннель.
    expose: ["5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        # Жёсткого потолка процессора нет: при свободных ядрах база пользуется всеми,
        # при нехватке работают веса cpu_shares.
        limits: {memory: "${ASTRA_DB_MEMORY:-2G}"}

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    # Живые события и онлайн-статус переживают перезапуск не обязаны,
    # но лимит памяти нужен, иначе Redis съест всё и его убьёт ядро.
    command: >
      redis-server --appendonly no --save ""
                   --maxmemory ${ASTRA_CACHE_MAXMEMORY:-384mb} --maxmemory-policy allkeys-lru
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits: {cpus: "0.5", memory: "${ASTRA_CACHE_MEMORY:-512M}"}

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    # Консоль MinIO (9001) наружу не публикуется. Нужна — пробрасывать по ssh:
    #   ssh -L 9001:localhost:9001 user@server  (после docker compose port storage 9001)
    expose: ["9000", "9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    # Хранилище файлов — фоновая нагрузка (подтяжка истории пишет в него гигабайты):
    # при нехватке процессора уступает базе и api.
    cpu_shares: ${ASTRA_STORAGE_CPU_SHARES:-512}
    deploy:
      resources:
        limits: {memory: "${ASTRA_STORAGE_MEMORY:-1G}"}

  # Одноразовый сервис. Отрабатывает и завершается; api ждёт кода возврата 0.
  # Так схема базы обновляется ровно один раз, а не в каждом контейнере,
  # который умеет запускать alembic.
  migrate:
    image: *backend-image
    build: *backend-build
    restart: "no"
    env_file: [.env]
    environment:
      SERVICE_ROLE: migrate
    depends_on:
      db: {condition: service_healthy}
    command: alembic upgrade head
    logging: *default-logging
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  api:
    image: *backend-image
    build: *backend-build
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_ROLE: api
    expose: ["8000"]
    # Реквизиты и прочие боевые файлы, которые нельзя класть в репозиторий
    # (secrets/ в .gitignore) — только для команд вроде load_requisites.
    volumes: ["./secrets:/secrets:ro"]
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_healthy}
      storage: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    # Число процессов uvicorn считается при старте по ядрам и памяти, которые видны
    # контейнеру (app/core/sizing.py): на нынешних 4 ядрах и 1,5 ГБ — те же 2, что
    # были вписаны здесь руками; на большем сервере — больше, без правки этого файла.
    command: python -m app.core.serve
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    # Менеджеры важнее фоновой загрузки: api получает вдвое больший вес, чем шлюз.
    cpu_shares: ${ASTRA_API_CPU_SHARES:-1024}
    deploy:
      resources:
        # Лимита cpus нет намеренно (как у шлюза): число процессов уже ограничено
        # половиной ядер, а жёсткий потолок мешал бы использовать новые ядра после
        # апгрейда сервера. Память — страховка: по ней же sizing не берёт лишних процессов.
        limits: {memory: "${ASTRA_API_MEMORY:-1536M}"}

  gateway:
    image: *backend-image
    build: *backend-build
    restart: unless-stopped
    # При выкатке шлюзу дают дописать начатую отправку: большой файл уходит в
    # Telegram десятки секунд, и обрыв на 10-й (умолчание Docker) означал бы
    # недоотправленное сообщение, которое очередь потом повторит.
    stop_grace_period: 60s
    env_file: [.env]
    environment:
      SERVICE_ROLE: gateway
    depends_on:
      api: {condition: service_healthy}
    command: python -m app.gateway.worker
    logging: *default-logging
    # Один контейнер — сколько внутри него процессов, решает сам код при
    # старте: app/gateway/worker.py поднимает по процессу на каждое ядро,
    # кроме одного (оставляем api/db/остальным), см. app/gateway/topology.py.
    # Апгрейд сервера (больше ядер) не требует трогать этот файл — при
    # следующем перезапуске контейнер сам увидит новое число ядер.
    #
    # Лимита cpus здесь намеренно нет: сам факт «не больше (ядра−1) процессов»
    # уже ограничивает, сколько ядер шлюз способен занять одновременно —
    # отдельный потолок только помешал бы использовать реально свободные ядра.
    #
    # Память — общий потолок-страховка на контейнер целиком, а не точный
    # бюджет на процесс: реальное решение «сколько аккаунтов брать прямо
    # сейчас» каждый процесс принимает сам, по факту занятости памяти самого
    # контейнера и хоста (app/gateway/load.py), а не по заранее угаданному
    # числу. Без блока плана потолок прежний — 1.5G; deploy/resource_plan.py
    # поднимает его под ожидаемое число аккаунтов (≈ 3G на 30 аккаунтов).
    # Сумма потолков всех контейнеров теперь может превышать память сервера:
    # потолки — предел, а не занятая память, и защищают приоритеты ниже.
    # Подтяжка истории — фон: шлюз получает меньший вес, чем база и api, и при
    # нехватке памяти ядро снимает именно его (супервизор и аренда аккаунтов
    # восстанавливают его за секунды), а не базу.
    cpu_shares: ${ASTRA_GATEWAY_CPU_SHARES:-512}
    oom_score_adj: 300
    deploy:
      resources:
        limits: {memory: "${ASTRA_GATEWAY_MEMORY:-1536M}"}

  scheduler:
    image: *backend-image
    build: *backend-build
    restart: unless-stopped
    env_file: [.env]
    environment:
      SERVICE_ROLE: scheduler
    depends_on:
      api: {condition: service_healthy}
    command: python -m app.scheduler.runner
    logging: *default-logging
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  # Собранная статика фронтенда. Сборка идёт ВНУТРИ образа (стадия build),
  # готовый dist с машины разработчика в продакшен не попадает.
  web:
    image: ${WEB_IMAGE:-astra-web}:${IMAGE_TAG:-local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    expose: ["80"]
    # Внутри образа фронтенда nginx держит запасной proxy_pass на api. Имя
    # должно резолвиться к моменту старта, иначе контейнер падает с
    # "host not found in upstream api" и уходит в цикл перезапусков.
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      # 127.0.0.1, не localhost: на части хостов /etc/hosts резолвит localhost
      # в ::1 первым, а nginx слушает только IPv4 — проверка не проходит,
      # хотя сервис отвечает нормально.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 192M}

  # Единственная точка входа снаружи: TLS, редирект с 80 на 443,
  # статика фронтенда и проксирование /api (включая вебсокет).
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Подставляется в шаблон конфигурации при старте контейнера.
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env, например crm.example.ru}
      # Ограничиваем подстановку одной переменной, иначе envsubst съест
      # $host, $remote_addr и прочие переменные самого nginx.
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

volumes:
  pgdata:
  minio-data:
