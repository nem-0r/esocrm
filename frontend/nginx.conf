# nginx внутри образа фронтенда: отдаёт собранный dist.
# Снаружи запросы приходят не сюда, а во внешний nginx (deploy/nginx.conf.template),
# который сам разводит /api и статику. Этот файл — только про статику.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Встроенный DNS докера. Нужен для того, чтобы имя api резолвилось во время
    # запроса, а не при старте: с обычным `proxy_pass http://api:8000` nginx
    # проверяет имя на старте и падает с "host not found in upstream api", если
    # контейнер api ещё не создан. Контейнер фронтенда после этого уходит в
    # цикл перезапусков на холодном старте.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # index.html кешировать нельзя. Имена файлов в assets/ содержат хеш и меняются
    # с каждой сборкой; если браузер оставит у себя старый index.html, он будет
    # запрашивать ассеты, которых после выката уже нет, и покажет белый экран.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Глубокие ссылки вида /payments/1042 должны открываться напрямую,
    # а не отдавать 404: маршрутизация живёт во фронтенде.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Запасной путь: /api сюда доходит только если образ подняли без внешнего
    # nginx (локальная проверка прод-сборки). В продакшене этот location молчит.
    location /api/ {
        set $astra_api http://api:8000;
        proxy_pass $astra_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Живые обновления идут по WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Файлы в assets/ неизменяемые: хеш в имени меняется вместе с содержимым.
    # Один заголовок Cache-Control, а не два (`expires` выдавал свой, и браузер
    # получал две разные инструкции по кешу).
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
}
