name: astra-crm

services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres -c shared_buffers=512MB -c work_mem=16MB
               -c max_connections=100 -c random_page_cost=1.1
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  cache:
    restart: unless-stopped
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    ports: ["6380:6379"]   # 6379 занят локальным redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  storage:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: [.env]
    environment:
      SERVICE_ROLE: api
    ports: ["8000:8000"]
    # Реквизиты и прочие боевые файлы, которые нельзя класть в репозиторий
    # (secrets/ в .gitignore) — только для команд вроде load_requisites.
    volumes: ["./backend:/app", "./secrets:/secrets:ro"]
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_healthy}
      storage: {condition: service_started}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  gateway:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: [.env]
    environment:
      SERVICE_ROLE: gateway
    volumes: ["./backend:/app"]
    depends_on:
      api: {condition: service_started}
    command: python -m app.gateway.worker

  scheduler:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    env_file: [.env]
    environment:
      SERVICE_ROLE: scheduler
    volumes: ["./backend:/app"]
    depends_on:
      api: {condition: service_started}
    command: python -m app.scheduler.runner

  web:
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    environment:
      # Внутри сети контейнеров API доступен по имени сервиса
      VITE_API_URL: http://api:8000
    ports: ["5173:5173"]
    volumes:
      - ./frontend:/app
      # node_modules берём из образа, а не с хоста: у них разная платформа
      - /app/node_modules
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata:
  minio-data:
